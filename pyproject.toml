[build-system]
# 77 is the first setuptools that reads license as an SPDX expression with license-files
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CanSNPer2"
# read from CanSNPer2/__init__.py without importing the package
dynamic = ["version"]
description = "Canonical SNP typing of bacterial genomes from assemblies or sequencing reads"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "David Sundell", email = "david.sundell@foi.se" }]
keywords = ["Bioinformatics", "SNP-typing", "sequence-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
# no third party runtime imports: the tree is written as a self-contained HTML viewer
# (modules/NewickTree.py), so ete3 and its imports are not needed. The external programs
# (minimap2, progressiveMauve, MUMmer4, samtools) are not Python packages; see
# docs/installation.md
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/CanSNPer2"
Documentation = "https://github.com/FOI-Bioinformatics/CanSNPer2/tree/master/docs"
Issues = "https://github.com/FOI-Bioinformatics/CanSNPer2/issues"
Changelog = "https://github.com/FOI-Bioinformatics/CanSNPer2/blob/master/CHANGELOG.md"

[project.scripts]
cansnper2 = "CanSNPer2.cli:main"

[tool.setuptools.dynamic]
version = { attr = "CanSNPer2.__version__" }

[tool.setuptools.packages.find]
include = ["CanSNPer2*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, and bugbear: the checks that find defects.
# Ignored: E402 (tests and scripts set up sys.path before their imports), E731 and E741
# (style), B904 (raise ... from inside except, a change of the tracebacks) and B905
# (zip(strict=), a change of behavior where lengths differ).
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = ["E402", "E731", "E741", "B904", "B905"]
