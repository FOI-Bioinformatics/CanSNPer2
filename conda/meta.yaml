{% set version = load_file_regex(
    load_file="CanSNPer2/__init__.py",
    regex_pattern='__version__ = "([0-9.]+)"').group(1) %}

package:
  name: cansnper2
  version: {{ version }}

source:
  # for a bioconda pull request replace this with the release tag:
  # url: https://github.com/FOI-Bioinformatics/CanSNPer2/archive/refs/tags/v{{ version }}.tar.gz
  # sha256: <sum of that archive>
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - cansnper2 = CanSNPer2.cli:main

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
  run:
    - python >=3.11
    # the aligner is the actual work horse and is not a python dependency;
    # the default has to be present, the others are optional (--aligner)
    - progressive-mauve          # verify the exact bioconda name at submission
  # optional aligners, mention in the summary instead of run_exports:
  #   minimap2, mummer4

test:
  imports:
    - CanSNPer2
    - CanSNPer2.modules
  commands:
    - cansnper2 --version
    - cansnper2 --help
    - cansnper2 selftest          # exit 0: the import check and one usable aligner

about:
  home: https://github.com/FOI-Bioinformatics/CanSNPer2
  license: BSD-3-Clause
  license_file: LICENSE
  summary: SNP-typing of assembled bacterial genomes against curated CanSNP databases
  description: |
    CanSNPer2 types a query assembly along a curated tree of canonical SNPs
    (CanSNPs): it aligns the query against the reference genomes of the
    database, reads the base at every SNP position and walks the tree to the
    final SNP. One command with a verb for every job: cansnper2 type,
    db create/import/export/info/convert/modify/remove, scheme list/get
    (databases from CanSNPer2-data) and ref get (reference genomes from NCBI).
  dev_url: https://github.com/FOI-Bioinformatics/CanSNPer2

extra:
  recipe-maintainers:
    - davsun        # replace with the GitHub accounts that will keep it current
