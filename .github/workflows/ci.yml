name: CI

# Installs CanSNPer2 and runs each command once: build a database, export it,
# download its reference genome and type that genome against itself with
# each aligner (minimap2 is the default). The Bacillus anthracis scheme from CanSNPer2-data is used
# because it is the smallest (13 SNPs, one reference genome).
#
# CanSNPer2 has no third party runtime dependencies since 2.2.0 (the ete3
# dependency capped python at 3.12), so the whole supported range 3.11-3.14
# is tested.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint

      - name: Lint with ruff
        run: python -m ruff check --output-format github .

      - name: Check the formatting with ruff
        run: python -m ruff format --check --diff .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: FOI-Bioinformatics/CanSNPer2-data
          path: cansnper2-data

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install progressiveMauve, minimap2 and samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y progressivemauve minimap2 samtools

      - name: Install MUMmer4 from bioconda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mummer4
          create-args: mummer4
          condarc: |
            channels:
              - conda-forge
              - bioconda
          init-shell: none

      - name: Put nucmer and delta-filter in PATH
        # wrappers for the two programs only, so the perl, ruby and openssl of the
        # environment do not shadow the system ones
        run: |
          mkdir -p "$RUNNER_TEMP/mummer4-bin"
          for p in nucmer delta-filter; do
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$MAMBA_ROOT_PREFIX/envs/mummer4/bin/$p" > "$RUNNER_TEMP/mummer4-bin/$p"
            chmod +x "$RUNNER_TEMP/mummer4-bin/$p"
          done
          echo "$RUNNER_TEMP/mummer4-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mummer4-bin/nucmer" --version

      - name: Install CanSNPer2
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check

      - name: Self test and command line help
        run: |
          cansnper2 selftest
          cansnper2 --help
          cansnper2 type --help
          cansnper2 db create --help
          cansnper2 scheme get --help
          cansnper2 ref get --help

      - name: Unit tests
        env:
          # the published-scheme tests read the CanSNPer2-data checkout above
          CANSNPER2_DATA: ${{ github.workspace }}/cansnper2-data
        # coverage is measured once, with Python 3.13, including the runs of cansnper2 that the
        # tests start as subprocesses; the table goes to the job summary
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            python -m pip install coverage
            python -m coverage run -m pytest -q tests
            python -m coverage combine -q
            python -m coverage report --sort=cover --format=markdown >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=total
          else
            python -m pytest -q tests
          fi

      - name: Build and export a database
        working-directory: ${{ runner.temp }}
        run: |
          SRC=$GITHUB_WORKSPACE/cansnper2-data/schemes/bacillus_anthracis
          cansnper2 db create -d ba.db \
            --tree $SRC/bacillus_anthracis_tree.txt \
            --cansnps $SRC/bacillus_anthracis_canSNPs.txt \
            --references $SRC/bacillus_anthracis_references.txt
          cansnper2 db export -d ba.db -o export
          cansnper2 db export -d ba.db --format newick -o export
          test -s export/ba_tree.nwk
          # a database rebuilt from the export must export to the same files
          cansnper2 db create -d rebuilt.db \
            --tree export/ba_tree.txt --cansnps export/ba_canSNPs.txt --references export/ba_references.txt
          cansnper2 db export -d rebuilt.db -o export_rebuilt
          for f in tree canSNPs references; do
            cmp export/ba_$f.txt export_rebuilt/rebuilt_$f.txt
          done

      - name: Build the same database from the scheme on CanSNPer2-data
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the anonymous API limit is shared by all jobs on a runner address
        run: |
          cansnper2 scheme list
          cansnper2 scheme get bacillus_anthracis --branch master --no-references
          test -s bacillus_anthracis.source.json
          cansnper2 db export -d bacillus_anthracis.db -o export_scheme
          for f in tree canSNPs references; do
            cmp export/ba_$f.txt export_scheme/bacillus_anthracis_$f.txt
          done

      - name: Download the reference genome
        working-directory: ${{ runner.temp }}
        run: |
          cansnper2 ref get -d ba.db -o references
          test -s references/Ames.fna

      - name: Type the reference genome against itself
        working-directory: ${{ runner.temp }}
        run: |
          cp -L references/Ames.fna query_Ames.fna
          cansnper2 type -d ba.db --ref-dir references -o results query_Ames.fna --summary
          grep -q "A.Br.001" results/snps_summary.txt

      - name: Type the reference genome with progressiveMauve, same call as minimap2
        working-directory: ${{ runner.temp }}
        run: |
          cansnper2 type -d ba.db --ref-dir references -o results_mauve query_Ames.fna --summary --aligner progressiveMauve
          # the # lines record the run (date, aligner) and differ; the rows must not
          diff <(grep -v '^#' results/snps_summary.txt) <(grep -v '^#' results_mauve/snps_summary.txt)

      - name: Type reads simulated from the reference genome, same call as the assembly
        working-directory: ${{ runner.temp }}
        run: |
          # 20x error-free 2x100 reads with 300 bp fragments from both strands
          python - <<'EOF'
          import gzip, random
          rng = random.Random(1)
          seq = "".join(l.strip() for l in open("query_Ames.fna") if not l.startswith(">")).upper()
          comp = str.maketrans("ACGT", "TGCA")
          with gzip.open("ames_R1.fastq.gz", "wt") as r1, gzip.open("ames_R2.fastq.gz", "wt") as r2:
              for i in range(len(seq) * 20 // 200):
                  s = rng.randint(0, len(seq) - 300)
                  f = seq[s:s + 300]
                  if rng.random() < 0.5:
                      f = f.translate(comp)[::-1]
                  r1.write("@r%d/1\n%s\n+\n%s\n" % (i, f[:100], "I" * 100))
                  r2.write("@r%d/2\n%s\n+\n%s\n" % (i, f.translate(comp)[::-1][:100], "I" * 100))
          EOF
          cansnper2 type -d ba.db --ref-dir references -o results_reads ames_R1.fastq.gz ames_R2.fastq.gz --summary
          test -s results_reads/samples/ames_site_counts.tsv
          # the sample is named after the read files; final SNP, support and path must agree
          diff <(grep -v '^#' results/snps_summary.txt | cut -f2-) <(grep -v '^#' results_reads/snps_summary.txt | cut -f2-)

      - name: Type the reference genome with MUMmer4, same call as minimap2
        working-directory: ${{ runner.temp }}
        run: |
          cansnper2 type -d ba.db --ref-dir references -o results_mummer4 query_Ames.fna --summary --aligner mummer4
          # the # lines record the run (date, aligner) and differ; the rows must not
          diff <(grep -v '^#' results/snps_summary.txt) <(grep -v '^#' results_mummer4/snps_summary.txt)
